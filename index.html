<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Reels</title>
  <link rel="stylesheet" href="./styles/main.css">
</head>
<body>

  <!-- Scroll container. Feed clones the template into a fixed pool of slides. -->
  <div class="feed" data-feed></div>

  <template data-slide-template>
    <article class="slide" data-slide>
      <video class="slide__video" loop playsinline muted preload="none"></video>
      <div class="slide__meta" data-meta></div>
    </article>
  </template>

  <button class="mute" data-mute type="button">🔇</button>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
